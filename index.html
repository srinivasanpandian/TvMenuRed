<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maghil Menu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="menu-container">
        <div class="menu-sections">
            <div class="menu-column" id="left-column">
                <!-- Main Menu -->
                <div class="menu-section">
                    <h2>MAIN MENU</h2>
                    <div class="menu-items" id="main-menu">
                        <!-- Dynamically filled by JavaScript -->
                    </div>
                </div>
            </div>

            <div class="center-column">
                <div class="logo-container">
                    <img src="img/logo.png" alt="Maghil Menu Logo" id="restaurant-logo">
                </div>
                <div class="popular-dish-container">
                    <h3>Featured Popular Dish</h3>
                    <div id="popularDishDisplay"></div>
                </div>
            </div>

            <div class="menu-column" id="right-column">
                <!-- Dessert Menu -->
                <div class="menu-section">
                    <h2>DESSERT MENU</h2>
                    <div class="menu-items" id="dessert-menu">
                        <!-- Dynamically filled by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Message for Updates -->
    <div class="status-message" id="status-message">
        Menu Updated
    </div>

    <!-- Time and Date Display -->
    <div class="time-display" id="timeDisplay">
        <span id="current-time"></span>
        <span id="current-date"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
